<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>千层套路的小屋</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff3f6;--card:#ffffffcc;--tx:#4a3340;--sub:#d6668d;--bd:#ffd9e4;--room1:#ffe3ee;--room2:#ffeede;--pill:#fff;--track:#ffe6ee;--ink:#3a2530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a1f;--card:#33252cdd;--tx:#f6e6ec;--sub:#ff9fbf;--bd:#4d3641;--room1:#4a2e3a;--room2:#46352f;--pill:#3d2c34;--track:#4d3641;--ink:#fff0f5}}
:root[data-theme="dark"]{--bg:#241a1f;--card:#33252cdd;--tx:#f6e6ec;--sub:#ff9fbf;--bd:#4d3641;--room1:#4a2e3a;--room2:#46352f;--pill:#3d2c34;--track:#4d3641;--ink:#fff0f5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#fff3f6,#fff0e6) fixed;background-color:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:var(--bg)}}
:root[data-theme="dark"] body{background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding:14px 14px 30px}
.top{text-align:center}
.top h1{margin:6px 0 0;font-size:26px;color:var(--ink)}
.top p{margin:2px 0 10px;font-size:12px;color:var(--sub);font-weight:600;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:10px 14px;margin-bottom:12px}
.aff{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.trk{flex:1;height:10px;background:var(--track);border-radius:9px;overflow:hidden}
.trk i{display:block;height:100%;background:linear-gradient(90deg,#ff9ec0,#ff6fa0);border-radius:9px;transition:width .4s}
.hearts{letter-spacing:1px;font-size:14px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:12px}
.pill{display:flex;align-items:center;gap:6px;background:var(--pill);border-radius:99px;padding:6px 12px;width:calc(33% - 6px);min-width:100px}
.pill .trk{height:7px}
.pill .t1 i{background:#ff8fb3}.pill .t2 i{background:#ffd75e}.pill .t3 i{background:#7fe3b0}.pill .t4 i{background:#a58cf2}
.hd{text-align:center;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.room{position:relative;height:230px;border-radius:20px;background:linear-gradient(160deg,var(--room1),var(--room2));overflow:hidden;border:1px solid var(--bd)}
#k{position:absolute;left:40%;top:48%;width:170px;height:auto;transition:left 2.2s ease-in-out,top 2.2s ease-in-out;transform:translate(-50%,-50%);filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff);-webkit-user-drag:none;user-select:none}
#k.bn{animation:bn .5s}
#k.sk{animation:sk .5s}
@keyframes bn{0%,100%{margin-top:0}40%{margin-top:-22px}}
@keyframes sk{0%,100%{margin-left:0}25%{margin-left:-8px}75%{margin-left:8px}}
#bub{display:none;position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--pill);color:var(--ink);font-size:12px;border-radius:12px;padding:3px 10px;opacity:0;transition:opacity .3s;white-space:nowrap}
.deco{position:absolute;bottom:8px;font-size:22px;opacity:.85}
.fl{position:absolute;font-size:24px;pointer-events:none;animation:up 1.1s forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-80px)}}
.cap{text-align:center;color:var(--sub);font-size:13px;margin:10px 0 2px;min-height:18px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid button{border:0;border-radius:18px;padding:18px 0;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.grid button:active{transform:scale(.96)}
.b1{background:linear-gradient(135deg,#ffd3e2,#ffbfd6)}.b2{background:linear-gradient(135deg,#fff0b8,#ffe0a0)}
.b3{background:linear-gradient(135deg,#d9e0ff,#c3d3ff)}.b4{background:linear-gradient(135deg,#cdf5e2,#b8efd5)}
.b5{grid-column:1/3;background:linear-gradient(135deg,#d4ecff,#c2dcff)}
@media (prefers-color-scheme:dark){.grid button{color:#3a2530}}
.diary .row{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:13px}
.diary .row:last-child{border:0}
.diary .row b{color:var(--sub);font-weight:600;min-width:42px}
.dl{max-height:210px;overflow-y:auto}
.empty{color:var(--sub);text-align:center;padding:10px 0;font-size:13px}
.gf{font-size:20px;letter-spacing:4px;word-break:break-all;margin-bottom:4px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9}
#ov div{background:var(--bg);border-radius:24px;padding:24px 28px;text-align:center;max-width:300px}
#ov .big{font-size:52px}
#ov button{margin-top:10px;border:0;background:#ff7fa8;color:#fff;padding:9px 26px;border-radius:99px;font-size:14px}
.rs{display:block;margin:12px auto 0;background:none;border:0;color:var(--sub);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>(๑˃ᴗ˂)ﻭ 千层套路</h1><p>Dorothy的宝宝</p></div>
  <div class="card aff">💝 好感度<div class="trk"><i id="affb"></i></div><span class="hearts" id="hrt"></span></div>
  <div class="pills" id="pills"></div>
  <div class="card">
    <div class="hd">🏠 千层套路的小屋</div>
    <div class="room" id="room">
      <div id="bub"></div><img id="k" alt="千层套路">
      <span class="deco" style="left:12px">🪴</span><span class="deco" style="left:46%">🐾</span><span class="deco" style="right:12px">🧸</span>
    </div>
    <div class="cap" id="cap"></div>
  </div>
  <div class="grid">
    <button class="b1" data-a="pet">🤍 摸摸</button><button class="b2" data-a="feed">🍙 喂饭</button>
    <button class="b3" data-a="play">🎀 一起玩</button><button class="b4" data-a="bath">🛁 洗澡澡</button>
    <button class="b5" data-a="gun">🔫 用水枪滋它一下</button>
  </div>
  <div class="card diary"><div class="hd" style="text-align:left">📔 千层套路的日记</div><div class="gf" id="gf"></div><div class="dl" id="dl"></div></div>
  <button class="rs" id="rs">重置存档</button>
</div>
<div id="ov"><div><div class="big" id="ovi"></div><h3 id="ovt"></h3><p id="ovp"></p><button id="ovb">收下</button></div></div>

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cl=v=>Math.max(0,Math.min(100,v));
function decay(){const m=Math.min((Date.now()-S.last)/60000,720);
 S.full=cl(S.full-m*.5);S.clean=cl(S.clean-m*.3);S.energy=cl(S.energy+m*.4);S.mood=cl(S.mood-m*.15);
 if(m>240)S.aff=cl(S.aff-Math.floor((m-240)/60));S.last=Date.now()}
let override=null,ot=0;
function face(){
 if(override&&Date.now()<ot)return override;
 if(S.full<25)return'hungry';if(S.clean<25)return'dirty';if(S.energy<15)return'sleepy';
 if(S.aff>=60&&S.mood>50)return'love';if(S.mood>65&&S.full>50)return'happy';return'ok'}

 $('pills').innerHTML=P.map(p=>`<div class="pill">${p[0]}<div class="trk ${p[2]}"><i style="width:${p[1]}%"></i></div></div>`).join('');
 $('dl').innerHTML=S.logs.length?S.logs.map(l=>`<div class="row"><b>${l.time}</b><span>${l.t}</span></div>`).join(''):'<div class="empty">还没有记录，快去摸摸千层套路吧</div>';
 $('gf').textContent=S.gifts.map(g=>g.n.split(' ')[0]).join(' ');
}
function wander(){$('k').style.left=(22+Math.random()*56)+'%';$('k').style.top=(40+Math.random()*22)+'%'}
function act(a){
 decay();const now=Date.now();
 S.rec[a]=(S.rec[a]||[]).filter(t=>now-t<30000);
 const n=S.rec[a].length,f=n>=5?0:n>=3?.5:1;
 let d=0,msg=R(MSG[a]),em='💗',fc='happy',bb='♪';
 if(a==='feed'){ if(S.full>90){d=-1;msg='吃不下啦，肚子圆滚滚的…';em='💢';fc='ok';bb='嗝…'}
  else{S.full=cl(S.full+25);S.mood=cl(S.mood+4);d=3*f;em='🍗';fc='eat'}}
 else if(a==='pet'){d=2.5*f;S.mood=cl(S.mood+5);S.energy=cl(S.energy-1);if(!f){msg='摸太多次啦，有点烦~';fc='angry';em='💤';bb='哼'}else{fc='love';bb='哼哼~'}}
 else if(a==='play'){ if(S.energy<20){msg='太累了，想休息一会儿…';em='💤';fc='sleepy';bb='zZ'}
  else{S.energy=cl(S.energy-20);S.full=cl(S.full-8);S.clean=cl(S.clean-6);S.mood=cl(S.mood+8);d=4*f;em='🎀';bb='再来！'}}
 else if(a==='bath'){ if(S.clean>85){d=-1;msg='才刚洗过，不要啦！';em='💢';fc='angry';bb='不要~'}
  else{S.clean=cl(S.clean+40);d=2*f;em='🫧';bb='噗噜~'}}
 else if(a==='gun'){S.clean=cl(S.clean+8);S.mood=cl(S.mood-12);d=-2;em='💦';fc='angry';bb='哼！'}
 S.rec[a].push(now);S.aff=cl(S.aff+d);
 log(msg);cap(msg);bub(bb);float(em);anim(d<0?'sk':'bn');setFace(fc,2500);wander();
 if(S.aff>=30&&d>0&&Math.random()<.08)giveGift('千层套路悄悄递给你一个小礼物');
 EGGS.forEach(e=>{if(S.aff>=e.at&&!S.eggs.includes(e.at)){S.eggs.push(e.at);S.gifts.push({n:e.g});
  log(`✨ 触发彩蛋「${e.t}」，获得 ${e.g}`);popup(e.icon,e.t,e.p+' 获得 '+e.g)}});
 save();render()}
function giveGift(txt){const g=R(GIFTS);S.gifts.push({n:g});log('🎁 千层套路叼来了 '+g+'，骄傲地放在你面前！');popup('🎁','意外之喜',txt+'：'+g)}
function popup(i,t,p){$('ovi').textContent=i;$('ovt').textContent=t;$('ovp').textContent=p;$('ov').style.display='flex'}
$('ovb').onclick=()=>{$('ov').style.display='none'};
document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>act(b.dataset.a));
let rc=0;$('rs').onclick=()=>{if(!rc){rc=1;$('rs').textContent='再点一次确认重置';setTimeout(()=>{rc=0;$('rs').textContent='重置存档'},3000)}
 else{S=fresh();save();rc=0;$('rs').textContent='重置存档';cap('你好呀，我是千层套路！');render()}};
function idle(){decay();wander();const m=R(IDLE);cap(m);if(Math.random()<.5)log(m);
 if(S.aff>=30&&Math.random()<.12){giveGift('千层套路悄悄递给你一个小礼物')}
 save();render()}
decay();cap(S.logs.length?'你回来啦！千层套路正在悠闲地四处逛~':'你好呀，我是千层套路！');save();render();wander();
setInterval(idle,12000);
</script>
</body>
</html>
